name: Android APK Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Check release secrets for tag builds
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          for var in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "Secret $var ausente. Tag precisa de assinatura de release."
              exit 1
            fi
          done
      - name: Check tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "versionName = \"${version}\"" app/build.gradle.kts; then
            echo "versionName em app/build.gradle.kts não é ${version}."
            exit 1
          fi
      - name: Run unit tests
        run: ./gradlew :app:testPlayDebugUnitTest :app:testGithubDebugUnitTest --no-daemon
      - name: Run lint
        run: ./gradlew :app:lintPlayDebug :app:lintGithubDebug :app:lintPlayRelease :app:lintGithubRelease --no-daemon
      - name: Prepare release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/meu-ponto-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/meu-ponto-release.jks" >> "$GITHUB_ENV"
      - name: Build signed github release APK
        run: ./gradlew :app:assembleGithubRelease --no-daemon
      - name: Build signed play release bundle
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != ''
        run: ./gradlew :app:bundlePlayRelease --no-daemon
      - name: Give APK a product filename
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME//\//-}"
          cp app/build/outputs/apk/github/release/app-github-release.apk "app/build/outputs/apk/github/release/Meu-Ponto-${ref}.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meu-ponto-apk
          path: app/build/outputs/apk/github/release/Meu-Ponto-*.apk
      - name: Upload signed AAB artifact
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: meu-ponto-aab
          path: app/build/outputs/bundle/playRelease/app-play-release.aab
      - name: Publish GitHub Release when tag is pushed
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/github/release/Meu-Ponto-*.apk
            app/build/outputs/bundle/playRelease/app-play-release.aab
