name: Android APK Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Give APK a product filename
        shell: bash
        run: cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/Meu-Ponto-${GITHUB_REF_NAME}.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meu-ponto-apk
          path: app/build/outputs/apk/debug/Meu-Ponto-*.apk
      - name: Publish GitHub Release when tag is pushed
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/debug/Meu-Ponto-*.apk
