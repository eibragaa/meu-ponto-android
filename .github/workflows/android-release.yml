name: Android APK Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        run: ./gradlew :app:testPlayDebugUnitTest :app:testGithubDebugUnitTest --no-daemon
      - name: Run lint
        run: ./gradlew :app:lintPlayDebug :app:lintGithubDebug :app:lintPlayRelease --no-daemon
      - name: Prepare release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/meu-ponto-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/meu-ponto-release.jks" >> "$GITHUB_ENV"
      - name: Build play debug APK
        run: ./gradlew :app:assemblePlayDebug --no-daemon
      - name: Build signed play release bundle
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != ''
        run: ./gradlew :app:bundlePlayRelease --no-daemon
      - name: Give APK a product filename
        shell: bash
        run: cp app/build/outputs/apk/play/debug/app-play-debug.apk "app/build/outputs/apk/play/debug/Meu-Ponto-${GITHUB_REF_NAME}.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meu-ponto-apk
          path: app/build/outputs/apk/play/debug/Meu-Ponto-*.apk
      - name: Upload signed AAB artifact
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: meu-ponto-aab
          path: app/build/outputs/bundle/playRelease/app-play-release.aab
      - name: Publish GitHub Release when tag is pushed
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/debug/Meu-Ponto-*.apk
      - name: Publish signed AAB when release secrets exist
        if: startsWith(github.ref, 'refs/tags/') && env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != ''
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/bundle/release/app-release.aab
